<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUCITA</title>
<meta name="theme-color" content="#c2185b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TUCITA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra superior con selector Usuaria/Admin · fondo translúcido de peluquería · Usuaria = tarjeta tipo celular · Admin = panel con pestañas */
  --bg:#f5f3f7; --surface:#ffffff; --surface-2:#faf8fb; --ink:#1d1726; --muted:#6c6475; --line:#e6e1ea;
  --accent:#c2185b; --accent-ink:#ffffff;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, var(--surface));
  --ok:#1b7a4b; --ok-soft:#dff3e8; --warn:#8a5a00; --warn-soft:#fdf0d5; --bad:#b3261e; --bad-soft:#fbe2e0;
  --wa:#1a8f4c; --wa-ink:#ffffff; --wa-bubble:#dcf8c6;
  --bg-op:.14;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141018; --surface:#1e1824; --surface-2:#251e2c; --ink:#f1ecf4; --muted:#a79fb0; --line:#352b3e;
    --accent:#f06292; --accent-ink:#1a0d14;
    --ok:#6fd49c; --ok-soft:#173326; --warn:#f2c46b; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3b1a18;
    --wa:#3ccf7d; --wa-ink:#06200f; --wa-bubble:#1f3b2a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141018; --surface:#1e1824; --surface-2:#251e2c; --ink:#f1ecf4; --muted:#a79fb0; --line:#352b3e;
  --accent:#f06292; --accent-ink:#1a0d14;
  --ok:#6fd49c; --ok-soft:#173326; --warn:#f2c46b; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3b1a18;
  --wa:#3ccf7d; --wa-ink:#06200f; --wa-bubble:#1f3b2a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cap::first-letter{text-transform:uppercase}

/* Fondo translúcido */
.fondo{position:fixed;inset:0;pointer-events:none;opacity:var(--bg-op);background-repeat:repeat;background-position:center;z-index:0}
.topbar,.wrap{position:relative;z-index:1}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .dot{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:20px}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);font-weight:700}
.btn-wa:hover{filter:brightness(1.06);border-color:var(--wa)}
.btn-sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

/* ===== Vista usuaria ===== */
.phone{max-width:440px;margin:0 auto;background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(30,10,40,.10)}
.biz{padding:22px 20px 18px;background:var(--accent-soft);display:flex;gap:14px;align-items:center}
.logo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:20px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.biz h1{font-size:21px}
.biz p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 20px 0}
.progress div{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.progress div::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.progress div.done::before,.progress div.now::before{background:var(--accent)}
.progress div.now{color:var(--ink);font-weight:700}
.pane{padding:16px 20px 22px;display:flex;flex-direction:column;gap:12px}
.pane h2{font-size:18px}
.back{align-self:flex-start}
.svc{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:13px 14px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.svc:hover{border-color:var(--accent)}
.svc strong{display:block}
.svc span{font-size:13px;color:var(--muted)}
.svc .price{font-weight:700;color:var(--ink);font-size:14.5px;white-space:nowrap}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.day:hover{border-color:var(--accent)}
.day small{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.day b{font-family:var(--display);font-size:20px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 0;cursor:pointer;font-weight:500}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:3px;font-size:14px}
.summary b{font-family:var(--display);font-size:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:13px;font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field .hint{font-size:12.5px;color:var(--muted)}
.phonein{display:flex;align-items:stretch}
.phonein span{border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;padding:10px;background:var(--surface-2);color:var(--muted)}
.phonein input{border-radius:0 10px 10px 0;flex:1;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13.5px}
.success{display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px 20px}
.success > h2{text-align:center}
.success .tick{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;font-weight:700}
.success .summary{width:100%}
.preview-title{align-self:stretch;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.wa-chat{align-self:stretch;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.wa-chat .who{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.wa-chat .who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wa)}
.bubble{background:var(--wa-bubble);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:14px;white-space:pre-line;max-width:92%}
.bubble small{display:block;text-align:right;color:var(--muted);font-size:11px;margin-top:4px}
.mail{align-self:stretch;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mail .mhead{padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;display:grid;gap:2px}
.mail .mbody{padding:12px;font-size:14px;white-space:pre-line}
.mail .mbody .mbrand{display:flex;gap:8px;align-items:center;font-family:var(--display);font-weight:800;margin-bottom:8px;white-space:normal}
.mail .mbody .mbrand .logo{width:30px;height:30px;border-radius:9px;font-size:12px}
.empty{color:var(--muted);font-size:14px;background:var(--surface-2);border-radius:var(--r);padding:14px;text-align:center}

/* ===== Vista admin ===== */
.adminbox{background:color-mix(in srgb, var(--bg) 88%, transparent);border-radius:20px;padding:4px}
.panel-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h1{font-size:26px}
.panel-head p{margin:2px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile small{color:var(--muted);font-size:12.5px;display:block}
.tile b{font-family:var(--display);font-size:24px}
.tile.alert{border-color:var(--warn);background:var(--warn-soft)}
.agendabar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.daybar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.dchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.dchip .count{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:0 7px;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.cita{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);padding:12px 14px;
  display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center}
.cita.confirmada{border-left-color:var(--ok)}
.cita.cancelada{border-left-color:var(--bad);opacity:.65}
.cita.nueva{box-shadow:0 0 0 2px var(--accent)}
.cita .hora{font-family:var(--display);font-weight:800;font-size:18px}
.cita .hora small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}
.cita .who b{font-size:15.5px}
.cita .who div{font-size:13.5px;color:var(--muted)}
.cita .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.agendada{background:var(--warn-soft);color:var(--warn)}
.pill.confirmada{background:var(--ok-soft);color:var(--ok)}
.pill.cancelada{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.sent{background:var(--ok-soft);color:var(--ok)}

/* Calendario semanal */
.week{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.wgrid{display:grid;min-width:720px}
.whead{padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface-2);text-align:center;cursor:pointer}
.whead:hover{background:var(--accent-soft)}
.whead b{display:block;text-transform:capitalize;font-size:14px}
.whead span{font-size:12px;color:var(--muted)}
.whead.hoy b{color:var(--accent)}
.wcorner{border-bottom:1px solid var(--line);background:var(--surface-2)}
.wtimes{position:relative}
.wtimes span{position:absolute;right:6px;font-size:11.5px;color:var(--muted);transform:translateY(-50%)}
.wcol{position:relative;border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour))}
.wblock{position:absolute;left:4px;right:4px;border-radius:8px;padding:3px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;
  background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);border-left:3px solid var(--warn);text-align:left;color:var(--ink)}
.wblock.confirmada{border-left-color:var(--ok)}
.wblock b{display:block;font-size:12px}
.wblock:hover{filter:brightness(.97)}
.wnow{position:absolute;left:0;right:0;height:2px;background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.notes{white-space:normal;min-width:180px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:240px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bizlink{font-family:var(--display);font-size:22px;font-weight:800;background:var(--accent-soft);border-radius:12px;padding:14px 16px;word-break:break-all}
.muted{color:var(--muted)}
.qr{width:150px;height:150px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw-custom{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
.upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upload .thumb{width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;overflow:hidden}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.daysel{display:flex;gap:6px;flex-wrap:wrap}
.daysel label{border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13.5px;display:flex;gap:6px;align-items:center;background:var(--surface)}
.daysel input{accent-color:var(--accent)}
input[type="range"]{accent-color:var(--accent);width:100%}

/* Login */
.login{max-width:420px;margin:12px auto 0;background:color-mix(in srgb, var(--surface) 95%, transparent);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(30,10,40,.10)}
.login .brandbig{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px}
.login .brandbig .dot{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px}
.login p{margin:0;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{background:var(--surface);font-weight:700}
.btn-google .g{width:18px;height:18px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);display:inline-block}
.info{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--ink)}
.demo{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.demo b{font-size:13px}
.demo button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px}
.demo button:hover{border-color:var(--accent)}
.demo button span{color:var(--muted)}

/* Barra demo de la vista usuaria */
.demo-bar{max-width:440px;margin:0 auto 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.demo-bar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;flex:1;min-width:180px}

/* Encabezado admin y avisos */
.grow{flex:1;min-width:200px}
.head-actions{display:flex;gap:8px;align-items:center;position:relative}
.bell{position:relative}
.bell .badge{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px;line-height:1.4}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);width:min(340px, 90vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 12px 30px rgba(30,10,40,.16);z-index:20;padding:8px;display:flex;flex-direction:column;gap:4px}
.dropdown .ditem{display:block;text-align:left;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13.5px}
.dropdown .ditem:hover{background:var(--surface-2)}
.dropdown .ditem span{display:block;color:var(--muted);font-size:12.5px}
.dropdown .dfoot{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 2px;border-top:1px solid var(--line);margin-top:4px;font-size:13px}
.banner{border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;font-size:14px;border:1px solid transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb, var(--warn) 30%, transparent)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 30%, transparent)}
.banner.neutral{background:var(--surface);color:var(--ink);border-color:var(--line)}
.blocked{max-width:560px;margin:10px auto;text-align:center;align-items:center}
.blocked .logo{width:64px;height:64px;font-size:24px;border-radius:18px}

function b64aBytes(b){ const p = "=".repeat((4 - b.length % 4) % 4); const t = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...t].map(c => c.charCodeAt(0))); }
async function suscripcionPush(pedir){

/* ---------- Utilidades ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const toMin = h => { const [a,b] = h.split(":").map(Number); return a*60 + b; };
const toHora = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const hhmm = t => (t || "").slice(0, 5);
const clp = new Intl.NumberFormat("es-CL", { style:"currency", currency:"CLP", maximumFractionDigits:0 });
const fechaLarga = s => parseISO(s).toLocaleDateString("es-CL", { weekday:"long", day:"numeric", month:"long" });
const fechaCorta = s => parseISO(s).toLocaleDateString("es-CL", { weekday:"short", day:"numeric", month:"short" });
const fechaMedia = s => parseISO(s).toLocaleDateString("es-CL", { day:"numeric", month:"long", year:"numeric" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtTel = t => t && t.length === 9 ? `+56 ${t.slice(0,1)} ${t.slice(1,5)} ${t.slice(5)}` : (t || "—");
const iniciales = s => (s || "").trim().split(/\s+/).slice(0,2).map(w => w[0] || "").join("").toUpperCase() || "TC";
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const emailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
const _fmt = new Intl.DateTimeFormat("en-CA", { timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23" });
function partes(d){ const o = {}; for (const p of _fmt.formatToParts(new Date(d))) o[p.type] = p.value; return { fecha:`${o.year}-${o.month}-${o.day}`, hora:`${o.hour}:${o.minute}` }; }
const hoyISO = () => partes(Date.now()).fecha;
const diasHasta = f => Math.round((parseISO(f) - parseISO(hoyISO())) / 86400000);
function proximosDiasDe(dias, n){
  const out = [], d = parseISO(hoyISO()); let guard = 0;
  while (out.length < n && guard++ < 70){ if (dias.includes(d.getDay())) out.push(iso(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function inkFor(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex || "")) return "#ffffff";
  const n = parseInt(hex.slice(1), 16), r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? "#1a1220" : "#ffffff";
}
function msgErr(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || "");
  if (/Invalid login credentials/i.test(m)) return "El correo o la contraseña no coinciden.";
  if (/Email not confirmed/i.test(m)) return "Aún no confirmas tu correo. Revisa tu bandeja de entrada (y spam) y abre el link de TUCITA.";
  if (/already registered|already been registered/i.test(m)) return "Ese correo ya tiene cuenta. Usa Entrar, o ¿Olvidaste tu contraseña?";
  if (/at least 6|Password should/i.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
  if (/rate limit|too many/i.test(m)) return "Hiciste muchos intentos seguidos. Espera unos minutos y vuelve a probar.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.";
  if (/row-level security|permission denied/i.test(m)) return "No tienes permiso para hacer eso.";
  return m || "Algo salió mal. Intenta de nuevo.";
}
async function q(promesa){ const { data, error } = await promesa; if (error) throw error; return data; }

/* Patrón de fondo de peluquería */
const PATRON = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260" fill="none" stroke="#7a6e85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(28 30) rotate(-25 30 30)"><circle cx="14" cy="52" r="9"/><circle cx="40" cy="52" r="9"/><path d="M19 44 L52 2 M35 44 L4 2"/></g><g transform="translate(150 28) rotate(18 40 12)"><rect x="0" y="0" width="84" height="14" rx="4"/><path d="M8 14v14M16 14v14M24 14v14M32 14v14M40 14v14M48 14v14M56 14v14M64 14v14M72 14v14"/></g><g transform="translate(36 150)"><circle cx="30" cy="26" r="24"/><circle cx="30" cy="26" r="9"/><path d="M54 18h30v16H54"/><path d="M84 18l8-4v28l-8-4"/><path d="M22 50l-6 34h18l2-34"/></g><g transform="translate(176 140)"><rect x="0" y="22" width="40" height="50" rx="10"/><rect x="10" y="0" width="20" height="22" rx="4"/><path d="M10 44h20"/></g><g transform="translate(118 196)"><ellipse cx="18" cy="20" rx="16" ry="20"/><path d="M18 40v24"/></g><path d="M120 112l4-10 4 10 10 4-10 4-4 10-4-10-10-4z"/></svg>`);

function aplicarMarca(cfg){
  const st = document.documentElement.style;
  if (cfg && cfg.color){ st.setProperty("--accent", cfg.color); st.setProperty("--accent-ink", inkFor(cfg.color)); }
  else { st.removeProperty("--accent"); st.removeProperty("--accent-ink"); }
  st.setProperty("--bg-op", cfg && cfg.fondo_op != null ? cfg.fondo_op : 0.14);

  else { f.style.backgroundImage = `url("${PATRON}")`; f.style.backgroundSize = "260px"; f.style.backgroundRepeat = "repeat"; }
}
const logoDe = (n, cls = "") => `<div class="logo ${cls}">${n && n.logo_url ? `<img src="${esc(n.logo_url)}" alt="Logo de ${esc(n.nombre)}">` : esc(iniciales(n && n.nombre))}</div>`;

const ST = {

const ESTADO_PILL = { pendiente_abono:"agendada", agendada:"agendada", confirmada:"confirmada", cancelada:"cancelada", no_asistio:"cancelada" };

function leerTokens(){ try { return (JSON.parse(localStorage.getItem(LS_KEY) || "[]") || []).filter(x => x && x.t && x.s); } catch (_) { return []; } }
function guardarToken(t, s){ try { const l = leerTokens().filter(x => x.t !== t); l.push({ t, s }); localStorage.setItem(LS_KEY, JSON.stringify(l.slice(-50))); } catch (_) {} }
const urlMaps = d => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d)}`;
const urlWaze = d => `https://waze.com/ul?q=${encodeURIComponent(d)}&navigate=yes`;

function slugDeRuta(){
  const qn = new URLSearchParams(location.search).get("n");
  if (qn) return qn.trim().toLowerCase();

    else {
      ST.pub = data; aplicarMarca(data); document.title = `${data.nombre} · Reserva tu hora`;
      const params = new URLSearchParams(location.search), r = params.get("r");

async function cargarMisHoras(){
  const tokens = leerTokens().map(x => x.t);
  ST.mis.citas = null; render();
  if (!tokens.length) { ST.mis.citas = []; return render(); }
  try { const data = await q(sb.rpc("mis_citas", { p_tokens: tokens })); ST.mis.citas = (data || []).filter(c => c.negocio.slug === ST.slug);
    if ("Notification" in window && Notification.permission === "granted") activarPushClienta(null, true); }
  catch (e) { ST.mis.citas = []; toast(`<b>No pudimos cargar tus horas</b><br>${esc(msgErr(e))}`); }
  render();
}

  </div>`;

function misHorasHTML(){
  const C = ST.mis.citas;
  let body;
  if (C === null) body = `<div class="empty">Cargando tus horas…</div>`;
  else if (!C.length) body = `<div class="empty">No hay horas guardadas en este teléfono para ${esc(ST.pub.nombre)}. Si reservaste desde otro teléfono, abre el link personal que te enviaste.</div>`;
  else {
    const prox = C.filter(c => new Date(c.fin) > Date.now() && c.estado !== "cancelada");
    const otras = C.filter(c => !prox.includes(c)).reverse().slice(0, 5);
    body = (prox.length ? prox.map(miCitaHTML).join("") : `<div class="empty">No tienes horas próximas.</div>`)
      + (otras.length ? `<div class="cat">Anteriores y anuladas</div>${otras.map(miCitaHTML).join("")}` : "");
  }
  return `<div class="phone">${bizHeaderPub()}<div class="pane">
    <button class="link back" data-action="mis-cerrar">← Reservar una hora</button>
    <h2>Mis horas</h2>${C && C.length ? avisoPushClientaHTML() : ""}${body}</div></div><p class="note">Reservas con TUCITA</p>`;
}

async function confirmarReserva(btn){
  const R = ST.reserva;
  const nombre = R.nombre.trim().replace(/\s+/g, " "), tel = R.tel.replace(/\D/g, ""), email = R.email.trim();
  if (nombre.length < 3) { R.error = "Escribe tu nombre y apellido."; return render(); }
  if (!/^9\d{8}$/.test(tel)) { R.error = "El celular debe tener 9 dígitos y empezar con 9 (ej: 912345678)."; return render(); }
  if (email && !emailOk(email)) { R.error = "Revisa el correo, parece incompleto."; return render(); }
  await conBoton(btn, async () => {
    try {
      R.resultado = await q(sb.rpc("reservar", { p_slug:ST.slug, p_servicio:R.servicioId, p_fecha:R.fecha, p_hora:R.hora,
        p_nombre:nombre, p_telefono:tel, p_email:email || null, p_whatsapp:R.wa }));
      R.paso = 5; R.error = ""; guardarToken(R.resultado.token, ST.slug);
      if ("Notification" in window && Notification.permission === "granted") activarPushClienta(null, true);
    } catch (e) { R.error = msgErr(e); }
  });
  render();
}

async function enviarLogin(btn){
  const L = ST.login, email = L.email.trim().toLowerCase(), pass = L.pass;
  L.error = ""; L.info = "";
  if (!emailOk(email)) { L.error = "Escribe un correo válido."; return render(); }

  await conBoton(btn, async () => {
    try {
      if (L.tab === "crear"){
        const data = await q(sb.auth.signUp({ email, password:pass, options:{ emailRedirectTo: location.origin } }));

      } else {
        await q(sb.auth.signInWithPassword({ email, password:pass }));
      }
    } catch (e) { L.error = msgErr(e); }
  });
  render();
}

async function cargarPerfil(forzar){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ST.user = null; ST.vista = "login"; aplicarMarca(null); return render(); }
  if (RECUPERANDO){ ST.user = session.user; ST.vista = "recuperar"; return render(); }
  if (!forzar && ST.user && ST.user.id === session.user.id && ST.vista !== "login") return;
  ST.user = session.user;
  ST.vista = "cargando"; render();
  try {
    ST.perfil = await q(sb.from("perfiles").select("*").eq("id", ST.user.id).maybeSingle());
    if (ST.perfil && ST.perfil.rol === "super") return cargarSuper();
    if (ST.perfil && ST.perfil.negocio_id) return cargarAdmin(ST.perfil.negocio_id, false);
    ST.vista = "sinNegocio"; render();
  } catch (e) { ST.vista = "login"; ST.login.error = msgErr(e); render(); }
}
async function salir(){
  pararCanal();
  await sb.auth.signOut();
  Object.assign(ST, { user:null, perfil:null, neg:null, soporte:false, vista:"login", tab:"agenda", campana:false });
  ST.login = { tab:"entrar", email:"", pass:"", error:"", info:"" };
  aplicarMarca(null); render();
}

function estadoDe(n, aj){
  const d = diasHasta(n.pagado_hasta);
  if (n.suspendido) return "suspendido";
  if (d < -aj.dias_gracia) return "vencido";
  if (d < 0) return "gracia";
  if (n.en_prueba) return "prueba";
  if (d <= aj.dias_aviso) return "por_vencer";
  return "activo";
}
const bloqueado = e => e === "vencido" || e === "suspendido";
const ESTADOS = { activo:["confirmada","Al día"], prueba:["info","En prueba"], por_vencer:["agendada","Vence pronto"],
  gracia:["cancelada","Vencido · en gracia"], vencido:["cancelada","Vencido · bloqueado"], suspendido:["info","Suspendido"] };
const pillEstado = e => `<span class="pill ${ESTADOS[e][0]}">${ESTADOS[e][1]}</span>`;
const planDe = clave => ST.planes.find(p => p.clave === clave) || { nombre:clave, precio:0 };

async function cargarAdmin(id, soporte){
  ST.vista = "cargando"; ST.soporte = soporte; render();
  try {
    const [neg, aj, planes] = await Promise.all([
      q(sb.from("negocios").select("*").eq("id", id).single()),
      q(sb.from("ajustes").select("*").single()),
      q(sb.from("planes").select("*").order("precio"))
    ]);
    ST.neg = neg; ST.ajustes = aj; ST.planes = planes;
    ST.estado = estadoDe(neg, aj);
    await cargarDatosNegocio();
    ST.vista = "admin"; ST.tab = "agenda"; ST.diaPanel = null;
    aplicarMarca(neg); render();
    escucharCitas();
  } catch (e) { ST.vista = "sinNegocio"; render(); toast(`<b>No pudimos cargar el negocio</b><br>${esc(msgErr(e))}`); }
}
async function cargarDatosNegocio(){
  const id = ST.neg.id;
  const desde = new Date(Date.now() - 86400000).toISOString(), hasta = new Date(Date.now() + 16 * 86400000).toISOString();
  try { await sb.rpc("expirar_abonos"); } catch (_) {}
  const [citas, clientas, servicios, pagos, avisos] = await Promise.all([
    q(sb.from("citas").select("id,inicio,fin,estado,recordado,vista,clienta_id,servicio_id,comentario,comentario_en,abono_monto,abono_pagado,expira_en,cancelada_por,reprogramada_en").eq("negocio_id", id).gte("inicio", desde).lt("inicio", hasta).order("inicio")),
    q(sb.from("clientas").select("*").eq("negocio_id", id).order("nombre")),
    q(sb.from("servicios").select("*").eq("negocio_id", id).order("categoria").order("precio")),
    q(sb.from("pagos").select("*").eq("negocio_id", id).order("fecha", { ascending:false })),
    q(sb.from("avisos_pago").select("id").eq("negocio_id", id).eq("revisado", false))
  ]);
  ST.clientas = clientas; ST.servicios = servicios; ST.pagos = pagos; ST.avisoPendiente = avisos.length > 0;
  const cl = Object.fromEntries(clientas.map(c => [c.id, c])), sv = Object.fromEntries(servicios.map(s => [s.id, s]));
  ST.citas = citas.map(c => { const a = partes(c.inicio), b = partes(c.fin);
    return { ...c, fecha:a.fecha, hora:a.hora, horaFin:b.hora, cl: cl[c.clienta_id] || { nombre:"(clienta)", telefono:"", acepta_whatsapp:false }, sv: sv[c.servicio_id] || { nombre:"(servicio)", precio:0, duracion_min:30 } }; });
}
async function recargar(){ try { await cargarDatosNegocio(); if (ST.vista === "admin") render(); } catch (_) {} }

function escucharCitas(){
  pararCanal();
  if (ST.soporte) return;
  const id = ST.neg.id;
  canal = sb.channel("citas-" + id)
    .on("postgres_changes", { event:"*", schema:"public", table:"citas", filter:`negocio_id=eq.${id}` }, async p => {
      await recargar();
      const n = p.new || {}, reciente = t => t && Date.now() - Date.parse(t) < 90000;
      let titulo = "";
      if (p.eventType === "INSERT") titulo = "Nueva reserva";
      else if (p.eventType === "UPDATE"){
        if (n.estado === "cancelada" && n.cancelada_por === "clienta" && !avisados.has(n.id + "c")) { titulo = "Una clienta anuló su hora"; avisados.add(n.id + "c"); }
        else if (reciente(n.reprogramada_en) && !avisados.has(n.id + n.reprogramada_en)) { titulo = "Una clienta cambió su hora"; avisados.add(n.id + n.reprogramada_en); }
        else if (reciente(n.comentario_en) && !avisados.has(n.id + n.comentario_en)) { titulo = "Comentario nuevo"; avisados.add(n.id + n.comentario_en); }
      }
      const c = ST.citas.find(x => x.id === n.id);
      if (titulo && c){
        const txt = `${c.cl.nombre} · ${c.sv.nombre} · ${fechaCorta(c.fecha)}, ${c.hora}${titulo === "Comentario nuevo" && c.comentario ? ` · «${c.comentario}»` : ""}`;
        toast(`<b>${titulo}</b><br>${esc(txt)}`);
        try { if ("Notification" in window && Notification.permission === "granted") new Notification(`${titulo} · TUCITA`, { body: txt }); } catch (_) {}
      }
    }).subscribe();
  // Respaldo por si se corta la conexión en vivo
  refresco = setInterval(() => {
    const tipeando = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (ST.vista === "admin" && ST.tab === "agenda" && !tipeando && !document.hidden) recargar();
  }, 120000);
}
function pararCanal(){ if (canal){ sb.removeChannel(canal); canal = null; } if (refresco){ clearInterval(refresco); refresco = null; } }

const proximosDias = n => proximosDiasDe(ST.neg.dias || [], n);
const activasDe = f => ST.citas.filter(c => c.fecha === f && c.estado !== "cancelada");
function minutosLibres(f){
  const ini = toMin(hhmm(ST.neg.apertura)), fin = toMin(hhmm(ST.neg.cierre));
  const ocupado = activasDe(f).reduce((t,c) => t + Math.max(0, Math.min(fin, toMin(c.horaFin)) - Math.max(ini, toMin(c.hora))), 0);
  return Math.max(0, fin - ini - ocupado);
}
const horasTxt = m => (m/60).toLocaleString("es-CL", { maximumFractionDigits:1 }) + " h";

/* ---------- Descargas a Excel (CSV) ---------- */
async function traerTodo(armar){
  const out = [];
  for (let desde = 0; desde < 100000; desde += 1000){ const filas = await q(armar().range(desde, desde + 999)); out.push(...filas); if (filas.length < 1000) break; }
  return out;
}
function descargarCSV(nombre, encabezados, filas){
  const celda = v => { const t = v == null ? "" : String(v); return /[;"\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const txt = "\ufeff" + [encabezados, ...filas].map(f => f.map(celda).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([txt], { type:"text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
async function exportar(tipo, negocioId, btn){
  const hoy = hoyISO(), f = qb => negocioId ? qb.eq("negocio_id", negocioId) : qb;
  const sufijo = negocioId ? "-" + ((ST.neg && ST.neg.id === negocioId ? ST.neg.slug : (ST.sup.negocios.find(n => n.id === negocioId) || {}).slug) || "negocio") : "-todos";
  await conBoton(btn, async () => {
    try {
      let n = 0;
      if (tipo === "citas"){
        const filas = await traerTodo(() => f(sb.from("citas").select("inicio,fin,estado,comentario,abono_monto,abono_pagado,cancelada_por,creado_en,negocios(nombre),clientas(nombre,telefono,email),servicios(nombre,precio)")).order("inicio", { ascending:false }));
        n = filas.length;
        descargarCSV(`tucita-citas${sufijo}-${hoy}.csv`, ["Negocio","Fecha","Hora inicio","Hora fin","Clienta","Celular","Correo","Servicio","Precio","Estado","Abono","Abono recibido","Anulada por","Comentario","Reservada el"],
          filas.map(c => { const a = partes(c.inicio), b = partes(c.fin); return [c.negocios && c.negocios.nombre, a.fecha.split("-").reverse().join("-"), a.hora, b.hora,
            c.clientas && c.clientas.nombre, c.clientas && c.clientas.telefono, c.clientas && c.clientas.email, c.servicios && c.servicios.nombre, c.servicios && c.servicios.precio,
            ESTADO_TXT[c.estado], c.abono_monto || "", c.abono_monto ? (c.abono_pagado ? "Sí" : "No") : "", c.cancelada_por || "", c.comentario, fechaHora(c.creado_en)]; }));
      }
      if (tipo === "clientas"){
        const filas = await traerTodo(() => f(sb.from("clientas").select("nombre,telefono,email,acepta_whatsapp,notas,creado_en,negocios(nombre)")).order("nombre"));
        n = filas.length;
        descargarCSV(`tucita-clientas${sufijo}-${hoy}.csv`, ["Negocio","Nombre","Celular","Correo","Acepta WhatsApp","Notas","Registrada el"],
          filas.map(c => [c.negocios && c.negocios.nombre, c.nombre, c.telefono, c.email, c.acepta_whatsapp ? "Sí" : "No", c.notas, fechaHora(c.creado_en)]));
      }
      if (tipo === "movimientos"){
        const filas = await traerTodo(() => f(sb.from("movimientos").select("creado_en,actor,detalle,negocios(nombre)")).order("creado_en", { ascending:false }));
        n = filas.length;
        descargarCSV(`tucita-movimientos${sufijo}-${hoy}.csv`, ["Fecha","Negocio","Quién","Qué pasó"], filas.map(m => [fechaHora(m.creado_en), m.negocios && m.negocios.nombre, m.actor, m.detalle]));
      }
      if (tipo === "pagos"){
        const filas = await traerTodo(() => f(sb.from("pagos").select("fecha,monto,pagado_hasta,nota,negocios(nombre)")).order("fecha", { ascending:false }));
        n = filas.length;
        descargarCSV(`tucita-pagos${sufijo}-${hoy}.csv`, ["Fecha","Negocio","Monto","Plan pagado hasta","Nota"], filas.map(p => [p.fecha.split("-").reverse().join("-"), p.negocios && p.negocios.nombre, p.monto, p.pagado_hasta.split("-").reverse().join("-"), p.nota]));
      }
      if (tipo === "negocios"){
        n = ST.sup.negocios.length;
        descargarCSV(`tucita-negocios-${hoy}.csv`, ["Negocio","Link","Rubro","Dirección","WhatsApp","Plan","Estado","Pagado hasta","Pide abono","Creado el"],
          ST.sup.negocios.map(x => [x.nombre, linkReservas(x.slug), x.rubro, x.direccion, x.tel_negocio, planDe(x.plan).nombre, ESTADOS[estadoDe(x, ST.ajustes)][1], x.pagado_hasta.split("-").reverse().join("-"), x.requiere_abono ? "Sí" : "No", fechaHora(x.creado_en)]));
      }
      toast(`<b>Descarga lista</b><br>${plural(n, "fila", "filas")}. Revisa tu carpeta de descargas.`);
    } catch (e) { toast(`<b>No se pudo descargar</b><br>${esc(msgErr(e))}`); }
  });
}

async function guardarMarca(btn){
  const v = id => document.getElementById(id).value.trim();
  const dias = [...document.querySelectorAll(".pDia:checked")].map(x => Number(x.value));
  const err = document.getElementById("pErr");
  const tel = v("pTel").replace(/\D/g, "");
  if (!v("pNombre")) { err.innerHTML = `<div class="err">El nombre del negocio no puede quedar vacío.</div>`; return; }
  if (toMin(v("pCierra")) - toMin(v("pAbre")) < 60) { err.innerHTML = `<div class="err">La hora de cierre debe ser al menos una hora después de la apertura.</div>`; return; }
  if (!dias.length) { err.innerHTML = `<div class="err">Marca al menos un día de atención.</div>`; return; }
  if (tel && !/^9\d{8}$/.test(tel)) { err.innerHTML = `<div class="err">El WhatsApp debe tener 9 dígitos y empezar con 9.</div>`; return; }
  const requiere = document.getElementById("pAbono").checked, monto = parseInt(v("pAbMonto"), 10) || 0, plazo = parseInt(v("pAbHoras"), 10), hc = parseInt(v("pHorasCambio"), 10);
  if (requiere && monto < 500) { err.innerHTML = `<div class="err">Si pides abono, escribe un monto (mínimo $500).</div>`; return; }
  if (!(plazo >= 1 && plazo <= 48)) { err.innerHTML = `<div class="err">El plazo del abono debe estar entre 1 y 48 horas.</div>`; return; }
  if (requiere && !v("pAbDatos")) { err.innerHTML = `<div class="err">Escribe los datos de transferencia para el abono.</div>`; return; }
  if (!(hc >= 0 && hc <= 72)) { err.innerHTML = `<div class="err">Las horas para cambios deben estar entre 0 y 72.</div>`; return; }
  const cambios = { nombre:v("pNombre"), rubro:v("pRubro"), direccion:v("pDir"), tel_negocio:tel, correo_negocio:v("pMail"),
    apertura:v("pAbre"), cierre:v("pCierra"), dias, color:ST.neg.color, fondo_op:Number(ST.neg.fondo_op),
    instagram:v("pIg"), requiere_abono:requiere, abono_monto:monto, abono_horas:plazo, abono_datos:document.getElementById("pAbDatos").value.trim(), horas_cambio:hc };
  await conBoton(btn, async () => {
    try { await q(sb.from("negocios").update(cambios).eq("id", ST.neg.id)); Object.assign(ST.neg, cambios); ST.guardado = "marca"; render();
      setTimeout(() => { ST.guardado = ""; const b = document.querySelector("#formMarca .btn-primary"); if (b) b.textContent = "Guardar cambios"; }, 1800); }
    catch (e) { err.innerHTML = `<div class="err">${esc(msgErr(e))}</div>`; }
  });
}
async function subirImagen(input, campo){
  const file = input.files && input.files[0]; if (!file) return;
  if (file.size > 3 * 1024 * 1024) { toast("<b>La imagen pesa más de 3 MB</b><br>Prueba con una más liviana."); return; }
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `${ST.neg.id}/${campo === "logo_url" ? "logo" : "fondo"}-${Date.now()}.${ext}`;
  toast("<b>Subiendo imagen…</b>");
  try {
    await q(sb.storage.from("imagenes").upload(path, file, { upsert:true, contentType:file.type }));
    const url = sb.storage.from("imagenes").getPublicUrl(path).data.publicUrl;
    await q(sb.from("negocios").update({ [campo]: url }).eq("id", ST.neg.id));
    ST.neg[campo] = url; aplicarMarca(ST.neg); render(); toast("<b>Imagen guardada</b>");
  } catch (e) { toast(`<b>No se pudo subir</b><br>${esc(msgErr(e))}`); }
}

async function cargarSuper(){
  pararCanal(); ST.soporte = false; ST.vista = "cargando"; aplicarMarca(null); render();
  try {
    const [negocios, perfiles, invitaciones, avisos, planes, ajustes, proximas, movs] = await Promise.all([
      q(sb.from("negocios").select("*").order("creado_en")),
      q(sb.from("perfiles").select("id,email,negocio_id,rol")),
      q(sb.from("invitaciones").select("*")),
      q(sb.from("avisos_pago").select("*").eq("revisado", false).order("creado_en")),
      q(sb.from("planes").select("*").order("precio")),
      q(sb.from("ajustes").select("*").single()),
      q(sb.from("citas").select("negocio_id").gte("inicio", new Date().toISOString()).neq("estado", "cancelada")),
      q(sb.from("movimientos").select("creado_en,actor,detalle,negocio_id").order("creado_en", { ascending:false }).limit(40))
    ]);
    const cuenta = {}; proximas.forEach(c => cuenta[c.negocio_id] = (cuenta[c.negocio_id] || 0) + 1);
    Object.assign(ST.sup, { negocios, perfiles, invitaciones, avisos, proximas:cuenta, movs });
    ST.planes = planes; ST.ajustes = ajustes;
    ST.vista = "super"; render();
  } catch (e) { ST.vista = "sinNegocio"; render(); toast(`<b>No pudimos cargar el panel</b><br>${esc(msgErr(e))}`); }
}

async function crearNegocio(btn){
  const U = ST.sup, nombre = document.getElementById("nNombre").value.trim(), rubro = document.getElementById("nRubro").value.trim();
  const email = document.getElementById("nEmail").value.trim().toLowerCase(), plan = document.getElementById("nPlan").value;
  if (!nombre) { U.error = "Escribe el nombre del negocio."; return render(); }
  if (!emailOk(email)) { U.error = "Revisa el correo de la dueña, parece incompleto."; return render(); }
  await conBoton(btn, async () => {
    try { const r = await q(sb.rpc("crear_negocio", { p_nombre:nombre, p_rubro:rubro, p_email_admin:email, p_plan:plan }));
      U.error = ""; U.nuevo = { nombre, email, slug:r.slug }; await cargarSuper(); }
    catch (e) { U.error = msgErr(e); render(); }
  });
}
async function guardarAjustes(btn){
  const n = id => parseInt(document.getElementById(id).value, 10);
  const vals = { dias_prueba:n("ajPrueba"), dias_aviso:n("ajAviso"), dias_gracia:n("ajGracia"), datos_transferencia:document.getElementById("ajDatos").value.trim() };
  if ([vals.dias_prueba, vals.dias_aviso, vals.dias_gracia].some(x => !(x >= 0))) { toast("<b>Revisa los días</b><br>Deben ser números de 0 o más."); return; }
  const precios = [...document.querySelectorAll(".ppre")].map(i => ({ clave:i.dataset.clave, precio:parseInt(i.value, 10) }));
  if (precios.some(p => !(p.precio >= 0))) { toast("<b>Revisa los precios</b>"); return; }
  await conBoton(btn, async () => {
    try {
      await q(sb.from("ajustes").update(vals).eq("id", 1));
      for (const p of precios) await q(sb.from("planes").update({ precio:p.precio }).eq("clave", p.clave));
      ST.sup.ajustesOk = true; await cargarSuper(); setTimeout(() => { ST.sup.ajustesOk = false; }, 1500);
    } catch (e) { toast(`<b>No se pudo guardar</b><br>${esc(msgErr(e))}`); }
  });
}

function enviar(fid, btn){
  if (fid === "formReserva") return confirmarReserva(btn);
  if (fid === "formLogin") return enviarLogin(btn);
  if (fid === "formRecuperar") return guardarNuevaPass(btn);
  if (fid === "formServicio") return guardarServicio(btn);
  if (fid === "formMarca") return guardarMarca(btn);
  if (fid === "formNegocio") return crearNegocio(btn);
  if (fid === "formAjustes") return guardarAjustes(btn);
}

document.addEventListener("click", e => {
  if (ST.campana && !e.target.closest(".head-actions")) { ST.campana = false; render(); }
  const el = e.target.closest("[data-action]"); if (!el) return;
  const R = ST.reserva, a = el.dataset.action, id = el.dataset.id;
  switch (a){
    case "enviar": { const f = el.closest("form"); if (f) enviar(f.id, el); return; }
    /* reserva */
    case "pick-svc": R.servicioId = id; R.paso = 2; R.error = ""; return render();
    case "pick-day": R.fecha = el.dataset.f; R.paso = 3; R.error = ""; return cargarHoras();
    case "pick-hora": R.hora = el.dataset.h; R.paso = 4; R.error = ""; return render();
    case "back": R.paso = Math.max(1, R.paso - 1); R.error = ""; if (R.paso === 3) return cargarHoras(); return render();
    case "nueva": Object.assign(R, { paso:1, servicioId:null, fecha:null, hora:null, horas:null, error:"", resultado:null }); ST.mis.abierto = false; return render();
    /* mis horas */
    case "mis-abrir": ST.mis.abierto = true; ST.mis.cambio = null; ST.mis.anular = null; window.scrollTo(0, 0); return cargarMisHoras();
    case "mis-cerrar": ST.mis.abierto = false; Object.assign(R, { paso:1, servicioId:null, fecha:null, hora:null, horas:null, error:"", resultado:null }); return render();
    case "comentar": { const t = el.dataset.t, txt = (document.getElementById("com-" + t) || {}).value || "";
      return conBoton(el, async () => { try { await q(sb.rpc("comentar_cita", { p_token:t, p_texto:txt })); delete ST.mis.borradores[t]; toast("<b>Comentario enviado</b><br>El local lo verá en su agenda."); await cargarMisHoras(); }
        catch (err) { toast(`<b>No se pudo enviar</b><br>${esc(msgErr(err))}`); } }); }
    case "mh-cambiar": ST.mis.cambio = { token:el.dataset.t, fecha:null, horas:null, hora:null }; ST.mis.anular = null; return render();
    case "mh-cerrar": ST.mis.cambio = null; return render();
    case "mh-dia": { const ch = ST.mis.cambio; ch.fecha = el.dataset.f; ch.horas = null; ch.hora = null; render();
      (async () => { try { const d = await q(sb.rpc("horas_libres_cambio", { p_token:ch.token, p_fecha:ch.fecha })); ch.horas = (d || []).map(x => typeof x === "string" ? x : Object.values(x)[0]); }
        catch (err) { ch.horas = []; toast(`<b>No se pudieron cargar las horas</b><br>${esc(msgErr(err))}`); } render(); })(); return; }
    case "mh-hora": ST.mis.cambio.hora = el.dataset.h; return render();
    case "mh-ok": { const ch = ST.mis.cambio;
      return conBoton(el, async () => { try { await q(sb.rpc("reprogramar_cita", { p_token:ch.token, p_fecha:ch.fecha, p_hora:ch.hora })); ST.mis.cambio = null; toast(`<b>Hora cambiada</b><br>Nueva hora: ${esc(fechaCorta(ch.fecha))} · ${ch.hora}`); await cargarMisHoras(); }
        catch (err) { toast(`<b>No se pudo cambiar</b><br>${esc(msgErr(err))}`); } }); }
    case "mh-anular": ST.mis.anular = el.dataset.t; return render();
    case "mh-anular-no": ST.mis.anular = null; return render();
    case "mh-anular-ok": { const t = el.dataset.t;
      return conBoton(el, async () => { try { await q(sb.rpc("cancelar_cita", { p_token:t })); ST.mis.anular = null; toast("<b>Hora anulada</b><br>Le avisamos al local."); await cargarMisHoras(); }
        catch (err) { toast(`<b>No se pudo anular</b><br>${esc(msgErr(err))}`); } }); }
    /* login */
    case "login-tab": ST.login.tab = el.dataset.t; ST.login.error = ""; ST.login.info = ""; return render();
    case "olvide": return olvide(el);
    case "logout": return salir();
    case "recargar": return cargarPerfil(true);
    /* admin */
    case "tab": ST.tab = el.dataset.tab; ST.campana = false; if (ST.tab === "historial") ST.movs = null; return render();
    case "push-admin": return activarPushAdmin(el);
    case "push-cli": return activarPushClienta(el, false);
    case "abono-ok": return cambiarCita(id, { abono_pagado:true, estado:"confirmada" });
    case "exportar": return exportar(el.dataset.tipo, el.dataset.sup ? (ST.sup.filtro || null) : (ST.neg ? ST.neg.id : null), el);
    case "modo": ST.modo = el.dataset.m; return render();
    case "ir-dia": ST.diaPanel = el.dataset.f; ST.modo = "dia"; ST.resaltar = id || null; return render();
    case "dia": ST.diaPanel = el.dataset.f; return render();
    case "estado": return cambiarCita(id, { estado: el.dataset.e });
    case "wa": cambiarCita(id, { recordado: true }); return;
    case "campana": ST.campana = !ST.campana; return render();
    case "ver-nueva": { const c = ST.citas.find(x => x.id === id); ST.campana = false; ST.tab = "agenda"; ST.modo = "dia"; ST.diaPanel = c.fecha; ST.resaltar = id;
      return cambiarCita(id, { vista: true }); }
    case "vistas": ST.campana = false;
      (async () => { try { await q(sb.from("citas").update({ vista:true }).eq("negocio_id", ST.neg.id).eq("vista", false)); } catch (_) {} await recargar(); })(); return;
    case "notif": try { Notification.requestPermission().then(p => { toast(p === "granted" ? "<b>Avisos activados</b><br>Te avisaremos mientras TUCITA esté abierta en este dispositivo." : "<b>No se activaron los avisos</b><br>Puedes activarlos en la configuración del navegador."); render(); }); } catch (_) {} return;
    case "toggle-svc": { const s = ST.servicios.find(x => x.id === id);
      (async () => { try { await q(sb.from("servicios").update({ activo: !s.activo }).eq("id", id)); } catch (err) { toast(`<b>No se pudo guardar</b><br>${esc(msgErr(err))}`); } await recargar(); })(); return; }
    case "color": ST.neg.color = el.dataset.c; aplicarMarca(ST.neg); document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", b === el)); return;
    case "quitar": (async () => { try { await q(sb.from("negocios").update({ [el.dataset.k]: null }).eq("id", ST.neg.id)); ST.neg[el.dataset.k] = null; aplicarMarca(ST.neg); render(); } catch (err) { toast(`<b>No se pudo guardar</b><br>${esc(msgErr(err))}`); } })(); return;
    case "avisar-pago": return conBoton(el, async () => { try { await q(sb.rpc("avisar_pago")); ST.avisoPendiente = true; render(); } catch (err) { toast(`<b>No se pudo avisar</b><br>${esc(msgErr(err))}`); } });
    case "copiar": return copiar(el.dataset.txt, el);
    case "volver-super": return cargarSuper();
    /* superadmin */
    case "pago": ST.sup.confirmar = id; return render();
    case "pago-no": ST.sup.confirmar = null; return render();
    case "pago-ok": return conBoton(el, async () => { try { const hasta = await q(sb.rpc("registrar_pago", { p_negocio:id }));
        ST.sup.confirmar = null; toast(`<b>Pago registrado</b><br>Plan pagado hasta el ${fechaMedia(String(hasta).slice(0,10))}.`); await cargarSuper(); } catch (err) { toast(`<b>No se pudo registrar</b><br>${esc(msgErr(err))}`); } });
    case "descartar": (async () => { try { await q(sb.from("avisos_pago").update({ revisado:true }).eq("id", id)); } catch (_) {} cargarSuper(); })(); return;
    case "suspender": return conBoton(el, async () => { try { await q(sb.rpc("set_suspendido", { p_negocio:id, p_valor: el.dataset.v === "true" })); await cargarSuper(); } catch (err) { toast(`<b>No se pudo cambiar</b><br>${esc(msgErr(err))}`); } });
    case "soporte": return cargarAdmin(id, true);
    case "cerrar-nuevo": ST.sup.nuevo = null; return render();
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".whead[data-action]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && ST.campana) { ST.campana = false; render(); }
  if (e.key === "Enter" && e.target.matches("form input") && !["checkbox","file","color","range"].includes(e.target.type)){
    e.preventDefault(); const f = e.target.closest("form"); enviar(f.id, f.querySelector('[data-action="enviar"]'));
  }
});
document.addEventListener("submit", e => e.preventDefault());
document.addEventListener("input", e => {
  const R = ST.reserva, id = e.target.id;
  if (id === "inNombre") R.nombre = e.target.value;
  if (id === "inTel" || id === "pTel") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 9); if (id === "inTel") R.tel = e.target.value; }
  if (id === "inEmail") R.email = e.target.value;
  if (id === "lgEmail") ST.login.email = e.target.value;
  if (id === "lgPass") ST.login.pass = e.target.value;
  if (e.target.classList.contains("comtxt")) ST.mis.borradores[e.target.dataset.t] = e.target.value;
  if (id === "inBuscar") { ST.buscar = e.target.value; document.getElementById("tablaClientas").innerHTML = tablaClientas();
    document.getElementById("totalClientas").textContent = `${filtrarClientas().length} de ${ST.clientas.length} clientas`; }
  if (id === "pColor") { ST.neg.color = e.target.value; aplicarMarca(ST.neg); document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", "false")); }
  if (id === "pOp") { ST.neg.fondo_op = parseFloat(e.target.value); aplicarMarca(ST.neg); }
});
document.addEventListener("change", async e => {
  const id = e.target.id;
  if (id === "inWa") ST.reserva.wa = e.target.checked;
  if (id === "supNeg") ST.sup.filtro = e.target.value;
  if (id === "pLogo") subirImagen(e.target, "logo_url");
  if (id === "pFondo") subirImagen(e.target, "fondo_url");
  if (e.target.classList.contains("nota")) {
    const c = ST.clientas.find(x => x.id === e.target.dataset.id), v = e.target.value.trim();
    if (c && c.notas !== v) { try { await q(sb.from("clientas").update({ notas:v }).eq("id", c.id)); c.notas = v; toast("<b>Nota guardada</b>"); } catch (err) { toast(`<b>No se pudo guardar la nota</b><br>${esc(msgErr(err))}`); } }
  }
  if (e.target.classList.contains("selPlan")) {
    try { await q(sb.rpc("cambiar_plan", { p_negocio:e.target.dataset.id, p_plan:e.target.value })); toast("<b>Plan actualizado</b>"); await cargarSuper(); }
    catch (err) { toast(`<b>No se pudo cambiar el plan</b><br>${esc(msgErr(err))}`); }
  }
});

/* =====================================================================
   INICIO
   ===================================================================== */
(function iniciar(){
  registrarSW();
  ST.slug = slugDeRuta();
  aplicarMarca(null);
  if (ST.slug){ render(); iniciarReserva(); return; }
  sb.auth.onAuthStateChange((evento, session) => {
    setTimeout(() => {
      if (evento === "PASSWORD_RECOVERY"){ RECUPERANDO = true; ST.user = session && session.user; ST.vista = "recuperar"; ST.login.error = ""; return render(); }
      if (evento === "SIGNED_OUT"){ if (ST.vista !== "login"){ ST.user = null; ST.vista = "login"; aplicarMarca(null); render(); } return; }
      if ((evento === "SIGNED_IN" || evento === "INITIAL_SESSION") && ST.vista !== "recuperar") cargarPerfil(false);
    }, 0);
  });
  (async () => {
    const { data:{ session } } = await sb.auth.getSession();
    const guardadas = leerTokens();
    if (!session && enPantallaInicio() && guardadas.length && !/type=/.test(location.hash)) {
      location.replace(`/${guardadas[guardadas.length - 1].s}?mis=1`); return;
    }
    cargarPerfil(false);
  })();
})();

</script>
